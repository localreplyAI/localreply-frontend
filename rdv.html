<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prendre rendez-vous — LocalReply</title>
<meta name="description" content="Réservez votre rendez-vous en ligne">
<link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #0052CC;
  --blue-mid: #0066FF;
  --cyan: #00D4FF;
  --surface: #0D1B2E;
  --surface-2: #0A1525;
  --border: rgba(255,255,255,0.08);
  --border-2: rgba(0,212,255,0.2);
  --text: rgba(255,255,255,0.92);
  --text-2: rgba(255,255,255,0.55);
  --text-3: #8896B3;
  --radius: 20px;
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  background: #0A1628;
  background-image:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,82,204,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,180,220,0.2) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 60% 30%, rgba(0,212,255,0.1) 0%, transparent 50%);
  font-family: var(--font);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 32px 16px;
}
.rdv-wrap { width: 100%; max-width: 520px; }
.rdv-header { text-align: center; margin-bottom: 24px; }
.rdv-avatar { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--blue-mid), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px; }
.rdv-biz-name { font-size: 20px; font-weight: 700; }
.rdv-biz-sub { color: var(--text-2); font-size: 14px; margin-top: 4px; }
.rdv-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
.rdv-steps { display: flex; gap: 8px; margin-bottom: 20px; }
.rdv-step-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
.rdv-step-dot.active { background: linear-gradient(90deg, var(--blue-mid), var(--cyan)); }
.rdv-label { font-size: 13px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
.rdv-service { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
.rdv-service:hover { border-color: var(--border-2); }
.rdv-service.selected { border-color: var(--cyan); background: rgba(0,212,255,0.06); }
.rdv-service-name { font-weight: 600; font-size: 15px; }
.rdv-service-meta { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.rdv-service-price { font-weight: 700; color: var(--cyan); font-size: 15px; }
.rdv-date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.rdv-date-nav button { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; }
.rdv-date-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
.rdv-date-label { font-weight: 600; font-size: 15px; text-transform: capitalize; }
.rdv-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rdv-slot { padding: 10px 4px; text-align: center; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: border-color .15s, background .15s; }
.rdv-slot:hover { border-color: var(--border-2); }
.rdv-slot.selected { border-color: var(--cyan); background: rgba(0,212,255,0.1); color: var(--cyan); }

    .rdv-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .rdv-cal-header button { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; }
    .rdv-cal-header button:disabled { opacity: 0.3; cursor: not-allowed; }
    .rdv-cal-title { font-weight: 600; font-size: 15px; text-transform: capitalize; }
    .rdv-cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
    .rdv-cal-weekdays div { text-align: center; font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; }
    .rdv-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .rdv-cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: default; border: 1px solid transparent; transition: border-color .15s, background .15s, transform .1s; }
    .rdv-cal-day.empty { visibility: hidden; }
    .rdv-cal-day.unavailable { color: var(--text-3); opacity: 0.35; text-decoration: line-through; }
    .rdv-cal-day.loading { color: var(--text-3); opacity: 0.5; }
    .rdv-cal-day.available { background: var(--surface-2); border-color: var(--border); color: var(--text); cursor: pointer; }
    .rdv-cal-day.available:hover { border-color: var(--border-2); }
    .rdv-cal-day.today:not(.selected) { border-color: var(--border-2); }
    .rdv-cal-day.selected { background: var(--cyan); border-color: var(--cyan); color: #04141c; box-shadow: 0 0 0 3px rgba(0,212,255,0.15); }
    .rdv-cal-day.available:active { transform: scale(0.92); }
    .rdv-slots-panel { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); animation: rdvFadeIn .25s ease; }
    .rdv-slots-panel-title { font-size: 12px; color: var(--text-2); margin-bottom: 10px; text-transform: capitalize; font-weight: 600; }
    .rdv-slots-panel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
    @keyframes rdvFadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.rdv-empty { color: var(--text-2); font-size: 14px; text-align: center; padding: 24px 0; }
.rdv-field { margin-bottom: 12px; }
.rdv-field label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.rdv-field input { width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: var(--font); font-size: 14px; }
.rdv-field input:focus { outline: none; border-color: var(--cyan); }
.rdv-summary { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; font-size: 14px; color: var(--text-2); }
.rdv-summary b { color: var(--text); }
.rdv-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-family: var(--font); font-weight: 700; font-size: 15px; cursor: pointer; transition: opacity .15s; }
.rdv-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.rdv-btn-primary { background: linear-gradient(90deg, var(--blue-mid), var(--cyan)); color: #06121f; }
.rdv-btn-primary:hover:not(:disabled) { opacity: 0.92; }
.rdv-btn-back { background: transparent; color: var(--text-2); margin-top: 10px; }
.rdv-notice { font-size: 12px; color: var(--text-3); text-align: center; margin-top: 14px; line-height: 1.5; }
.rdv-success { text-align: center; padding: 12px 0; }
.rdv-success-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,212,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px; }
.rdv-success-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
.rdv-success-msg { color: var(--text-2); font-size: 14px; line-height: 1.5; }
.rdv-loader { text-align: center; padding: 60px 0; color: var(--text-2); }
.rdv-error { text-align: center; padding: 60px 20px; color: var(--text-2); }
.rdv-lang-switch { display: flex; justify-content: center; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
.rdv-lang-switch button { background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.45; padding: 4px; }
.rdv-lang-switch button.active { opacity: 1; }
.rdv-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-3); }
.rdv-footer a { color: var(--text-3); }
</style>
</head>

  it: { stepStaff:'Con chi desidera il suo appuntamento?', anyStaff:'Nessuna preferenza', step1:'Scegli un servizio', step2:'Scegli un orario', step3:'I tuoi dati', minutes:'min', today:'Oggi', noSlots:'Nessun orario disponibile in questo giorno.', name:'Nome completo', phone:'Telefono', email:'Email (opzionale)', next:'Continua', back:'Indietro', confirm:'Conferma appuntamento', confirming:'Invio in corso…', summaryFor:'Appuntamento per', summaryOn:'il', summaryAt:'alle', pendingTitle:'Richiesta inviata!', pendingMsg:'La tua richiesta è stata ricevuta. L\'attività la confermerà a breve — riceverai un\'email di conferma.', confirmedTitle:'Appuntamento confermato!', confirmedMsg:'Il tuo appuntamento è confermato. Ti è stata inviata un\'email di conferma.', conflictMsg:'Questo orario è appena stato preso. Scegline un altro.', errorGeneric:'Si è verificato un errore. Riprova.', notFoundTitle:'Attività non trovata', notFoundMsg:'Questo link non è valido o l\'attività non esiste più.', newBooking:'Fai una nuova richiesta', requiredFields:'Inserisci il tuo nome e numero di telefono.', closed:'Chiuso', demoMsg:'Questa è una demo: non è stato creato alcun appuntamento reale e non verrà inviata alcuna email.', bookingDisabledMsg:'Questo servizio è temporaneamente non disponibile. Vi preghiamo di contattarci direttamente.' },
  pt: { stepStaff:'Com quem deseja a sua marcação?', anyStaff:'Sem preferência', step1:'Escolha um serviço', step2:'Escolha um horário', step3:'Os seus dados', minutes:'min', today:'Hoje', noSlots:'Nenhum horário disponível nesse dia.', name:'Nome completo', phone:'Telefone', email:'Email (opcional)', next:'Continuar', back:'Voltar', confirm:'Confirmar marcação', confirming:'A enviar…', summaryFor:'Marcação para', summaryOn:'em', summaryAt:'às', pendingTitle:'Pedido enviado!', pendingMsg:'O seu pedido foi recebido. O estabelecimento irá confirmá-lo em breve — receberá um email de confirmação.', confirmedTitle:'Marcação confirmada!', confirmedMsg:'A sua marcação está confirmada. Foi enviado um email de confirmação.', conflictMsg:'Este horário acabou de ser reservado. Escolha outro, por favor.', errorGeneric:'Ocorreu um erro. Por favor tente novamente.', notFoundTitle:'Estabelecimento não encontrado', notFoundMsg:'Este link não é válido ou o estabelecimento já não existe.', newBooking:'Fazer um novo pedido', requiredFields:'Indique o seu nome e telefone.', closed:'Encerrado', demoMsg:'Esta é uma demonstração: nenhuma marcação real foi criada e nenhum email será enviado.', bookingDisabledMsg:'Este serviço está temporariamente indisponível. Por favor, contacte-nos diretamente.' },
  nl: { stepStaff:'Bij wie wilt u uw afspraak?', anyStaff:'Geen voorkeur', step1:'Kies een dienst', step2:'Kies een tijdstip', step3:'Uw gegevens', minutes:'min', today:'Vandaag', noSlots:'Geen beschikbare tijdstippen op deze dag.', name:'Volledige naam', phone:'Telefoonnummer', email:'E-mail (optioneel)', next:'Doorgaan', back:'Terug', confirm:'Afspraak bevestigen', confirming:'Verzenden…', summaryFor:'Afspraak voor', summaryOn:'op', summaryAt:'om', pendingTitle:'Aanvraag verzonden!', pendingMsg:'Uw aanvraag is ontvangen. Het bedrijf zal deze binnenkort bevestigen — u ontvangt een bevestigingsmail.', confirmedTitle:'Afspraak bevestigd!', confirmedMsg:'Uw afspraak is bevestigd. Er is een bevestigingsmail naar u verzonden.', conflictMsg:'Dit tijdstip is zojuist ingenomen. Kies een ander tijdstip.', errorGeneric:'Er is een fout opgetreden. Probeer het opnieuw.', notFoundTitle:'Bedrijf niet gevonden', notFoundMsg:'Deze link is ongeldig of het bedrijf bestaat niet meer.', newBooking:'Nieuwe aanvraag doen', requiredFields:'Vul uw naam en telefoonnummer in.', closed:'Gesloten', demoMsg:'Dit is een demo: er is geen echte afspraak aangemaakt en er wordt geen e-mail verzonden.', bookingDisabledMsg:'Deze dienst is tijdelijk niet beschikbaar. Neem rechtstreeks contact met ons op.' },
  pl: { stepStaff:'Z kim chcesz się umówić?', anyStaff:'Bez preferencji', step1:'Wybierz usługę', step2:'Wybierz termin', step3:'Twoje dane', minutes:'min', today:'Dzisiaj', noSlots:'Brak dostępnych terminów tego dnia.', name:'Imię i nazwisko', phone:'Numer telefonu', email:'Email (opcjonalnie)', next:'Dalej', back:'Wstecz', confirm:'Potwierdź wizytę', confirming:'Wysyłanie…', summaryFor:'Wizyta na', summaryOn:'dnia', summaryAt:'o', pendingTitle:'Zgłoszenie wysłane!', pendingMsg:'Twoje zgłoszenie zostało odebrane. Firma wkrótce je potwierdzi — otrzymasz e-mail z potwierdzeniem.', confirmedTitle:'Wizyta potwierdzona!', confirmedMsg:'Twoja wizyta jest potwierdzona. Wysłaliśmy e-mail z potwierdzeniem.', conflictMsg:'Ten termin został właśnie zajęty. Wybierz inny.', errorGeneric:'Wystąpił błąd. Spróbuj ponownie.', notFoundTitle:'Nie znaleziono firmy', notFoundMsg:'Ten link jest nieprawidłowy lub firma już nie istnieje.', newBooking:'Wyślij nowe zgłoszenie', requiredFields:'Podaj imię i numer telefonu.', closed:'Zamknięte', demoMsg:'To jest wersja demonstracyjna: nie utworzono żadnej prawdziwej wizyty i nie zostanie wysłany żaden e-mail.', bookingDisabledMsg:'Ta usługa jest tymczasowo niedostępna. Prosimy o bezpośredni kontakt.' }

const LOCALE_MAP = { fr:'fr-FR', en:'en-GB', de:'de-DE', es:'es-ES', it:'it-IT', pt:'pt-PT', nl:'nl-NL', pl:'pl-PL' };
const FLAGS = { fr:'🇫🇷', en:'🇬🇧', de:'🇩🇪', es:'🇪🇸', it:'🇮🇹', pt:'🇵🇹', nl:'🇳🇱', pl:'🇵🇱' };

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name) || '';
}
function detectBrowserLang() {
  const l = (navigator.language || 'fr').split('-')[0].toLowerCase();
  return SUPPORTED_LANGS.includes(l) ? l : 'fr';
}

const urlLang = (function() {
  const p = getParam('lang') || getParam('lng');
  return (p && SUPPORTED_LANGS.includes(p.toLowerCase())) ? p.toLowerCase() : '';
})();
let lang = urlLang || detectBrowserLang();
let biz = null;
let selectedService = null;
let selectedDate = new Date();
let selectedSlot = null;
let selectedResource = null;
let calendarMonth = null;
let dayAvailability = {};
let bubbleOpenDate = null;
let submitting = false;
const DEMO_SLUGS = ['salon-marie-demo'];
let isDemoMode = false;

function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.fr[key]; }

function fmtDate(d) {
  return d.toLocaleDateString(LOCALE_MAP[lang] || 'fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString(LOCALE_MAP[lang] || 'fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

const wrap = document.getElementById('rdvWrap');

async function boot() {
  const pathMatch = window.location.pathname.match(/^\/rdv\/([^\/]+)/);
  const slug = getParam('slug') || getParam('s') || (pathMatch ? decodeURIComponent(pathMatch[1]) : null);
  if (!slug) { renderNotFound(); return; }
  try {
    const r = await fetch(`${API}/api/booking/${encodeURIComponent(slug)}/info`);
    if (!r.ok) { renderNotFound(); return; }
    biz = await r.json();
    // Récupérer le type de commerce (endpoint public séparé) pour adapter l'affichage — best-effort, non bloquant
    try {
      const btRes = await fetch(`${API}/api/business/slug/${encodeURIComponent(slug)}`);
      if (btRes.ok) { const btData = await btRes.json(); biz.business_type = btData.business_type; }
    } catch (e) { /* silencieux — l'affichage par défaut reste correct */ }
    isDemoMode = DEMO_SLUGS.includes(biz.slug);
    if (!urlLang && biz.interface_language && SUPPORTED_LANGS.includes(biz.interface_language)) {
      lang = biz.interface_language;
    }
    if (biz.booking_disabled) { renderUnavailable(); } else { renderStep1(); }
  } catch (e) {
    renderNotFound();
  }
}

function renderNotFound() {
  wrap.innerHTML = `
    <div class="rdv-card rdv-error">
      <div style="font-size:36px;margin-bottom:12px;">🔍</div>
      <div style="font-weight:700;font-size:17px;margin-bottom:8px;">${t('notFoundTitle')}</div>
      <div>${t('notFoundMsg')}</div>
    </div>`;
}

function renderUnavailable() {
  wrap.innerHTML = `
    <div class="rdv-card rdv-error">
      <div style="font-size:36px;margin-bottom:12px;">🕒</div>
      <div style="font-weight:700;font-size:17px;margin-bottom:8px;">${escapeHtml(biz.name || '')}</div>
      <div>${t('bookingDisabledMsg')}</div>
    </div>`;
}

function header(activeStep) {
  const initials = (biz.name || '?').slice(0, 1).toUpperCase();
  return `
    <div class="rdv-header">
      <div class="rdv-avatar">${biz.logo_url ? `<img src="${biz.logo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">` : initials}</div>
      <div class="rdv-biz-name">${escapeHtml(biz.name || '')}</div>
      ${biz.address ? `<div class="rdv-biz-sub">${escapeHtml(biz.address)}</div>` : ''}
    </div>
    <div class="rdv-steps">
      <div class="rdv-step-dot ${activeStep >= 1 ? 'active' : ''}"></div>
      <div class="rdv-step-dot ${activeStep >= 2 ? 'active' : ''}"></div>
      <div class="rdv-step-dot ${activeStep >= 3 ? 'active' : ''}"></div>
    </div>`;
}

function langSwitcher() {
  return `<div class="rdv-lang-switch">${SUPPORTED_LANGS.map(l => `<button class="${l === lang ? 'active' : ''}" onclick="switchLang('${l}')">${FLAGS[l]}</button>`).join('')}</div>`;
}
window.switchLang = function(l) {
  lang = l;
  if (selectedService && selectedSlot) renderStep3();
  else if (selectedService) renderStep2();
  else renderStep1();
};

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Types où la durée n'est pas une info pertinente pour le client (table, chambre, séance... pas un créneau de service classique)
const NO_DURATION_TYPES = new Set([
  'opticien','bakery','butcher','fishmonger','florist','retail','pharmacy',
  'restaurant','cafe','pizzeria','cinema','escapegame','pool','hotel',
]);

function renderStep1() {
  const services = biz.services || [];
  wrap.innerHTML = `
    ${header(1)}
    <div class="rdv-card">
      <div class="rdv-label">${t('step1')}</div>
      <div id="rdvServiceList">
        ${services.length ? services.map((s, i) => `
          <div class="rdv-service" onclick="selectService(${i})" id="svc-${i}">
            <div>
              <div class="rdv-service-name">${escapeHtml(s.name)}</div>
              ${NO_DURATION_TYPES.has(biz.business_type) ? '' : `<div class="rdv-service-meta">${s.duration_minutes} ${t('minutes')}</div>`}
            </div>
            ${s.price ? `<div class="rdv-service-price">${s.price} ${s.currency || 'CHF'}</div>` : ''}
          </div>`).join('') : `<div class="rdv-empty">${t('noSlots')}</div>`}
      </div>
    </div>
    ${langSwitcher()}
    <div class="rdv-footer">Propulsé par <a href="https://uselocalreply.com" target="_blank">LocalReply</a></div>`;
}

window.selectService = function(i) {
  selectedService = (biz.services || [])[i];
  selectedResource = null;
  selectedDate = new Date();
  selectedSlot = null;
  if (biz.staff_selection_enabled && (biz.staff || []).length > 0) {
    renderStaffStep();
  } else {
    renderStep2();
  }
};

function renderStaffStep() {
  const staff = biz.staff || [];
  wrap.innerHTML = `
    ${header(1)}
    <div class="rdv-card">
      <div class="rdv-label">${t('stepStaff')} — ${escapeHtml(selectedService.name)}</div>
      <div id="rdvStaffList">
        <div class="rdv-service" onclick="selectResource(null)" id="staff-any">
          <div class="rdv-service-name">${t('anyStaff')}</div>
        </div>
        ${staff.map((st, i) => `
          <div class="rdv-service" onclick="selectResource(${i})" id="staff-${i}">
            <div class="rdv-service-name">${escapeHtml(st.name)}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <button class="rdv-btn rdv-btn-back" onclick="renderStep1()">← ${t('back')}</button>
    ${langSwitcher()}`;
}

window.selectResource = function(i) {
  const staff = biz.staff || [];
  selectedResource = (i === null || i === undefined) ? null : staff[i];
  selectedDate = new Date();
  selectedSlot = null;
  renderStep2();
};

const WEEKDAY_LABELS = {
  fr: ['L','M','M','J','V','S','D'], en: ['M','T','W','T','F','S','S'], de: ['M','D','M','D','F','S','S'],
  es: ['L','M','X','J','V','S','D'], it: ['L','M','M','G','V','S','D'], pt: ['S','T','Q','Q','S','S','D'],
  nl: ['M','D','W','D','V','Z','Z'], pl: ['P','W','Ś','C','P','S','N']
};

function isDayClosed(dateObj) {
  const dow = ['sun','mon','tue','wed','thu','fri','sat'][dateObj.getDay()];
  const h = (biz.hours || []).find(x => x.day === dow);
  return h ? !!h.is_closed : false;
}

function monthLabel(d) {
  return d.toLocaleDateString(LOCALE_MAP[lang] || 'fr-FR', { month: 'long', year: 'numeric' });
}

function initCalendar() {
  if (!calendarMonth) calendarMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
  renderCalendarGrid();
  loadMonthAvailability();
}

window.changeMonth = function(delta) {
  const nm = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + delta, 1);
  const curMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  if (nm < curMonth) return;
  calendarMonth = nm;
  closeBubble();
  renderCalendarGrid();
  loadMonthAvailability();
};

function renderCalendarGrid() {
  const el = document.getElementById('rdvCalendar');
  if (!el) return;
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = isoDate(new Date());
  const curMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const weekdayLabels = WEEKDAY_LABELS[lang] || WEEKDAY_LABELS.fr;

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div class="rdv-cal-day empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const dStr = isoDate(d);
    const isPast = dStr < todayStr;
    const isToday = dStr === todayStr;
    const isSelected = selectedSlot && dStr === isoDate(selectedDate);
    let cls = 'rdv-cal-day';
    let clickable = false;
    if (isPast) {
      cls += ' unavailable';
    } else if (isDayClosed(d)) {
      cls += ' unavailable';
    } else if (dayAvailability[dStr] === undefined) {
      cls += ' loading';
    } else if (!dayAvailability[dStr] || !dayAvailability[dStr].length) {
      cls += ' unavailable';
    } else {
      cls += ' available';
      clickable = true;
    }
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    cells += `<div class="${cls}" ${clickable ? `onclick="selectDay('${dStr}', this)"` : ''} id="cal-${dStr}">${day}</div>`;
  }

  el.innerHTML = `
    <div class="rdv-cal-header">
      <button onclick="changeMonth(-1)" ${new Date(year, month, 1) <= curMonth ? 'disabled' : ''}>‹</button>
      <div class="rdv-cal-title">${monthLabel(calendarMonth)}</div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="rdv-cal-weekdays">${weekdayLabels.map(w => `<div>${w}</div>`).join('')}</div>
    <div class="rdv-cal-grid" id="rdvCalGrid">${cells}</div>
    <div id="rdvSlotsPanel"></div>
  `;
}

function generateDemoSlots(dStr) {
  const dow = ['sun','mon','tue','wed','thu','fri','sat'][new Date(dStr + 'T00:00:00').getDay()];
  const h = (biz.hours || []).find(x => x.day === dow);
  if (!h || h.is_closed) return [];
  const dur = (selectedService && selectedService.duration_minutes) || 30;
  const [openH, openM] = h.open_time.split(':').map(Number);
  const [closeH, closeM] = h.close_time.split(':').map(Number);
  const slots = [];
  let cur = new Date(dStr + 'T00:00:00');
  cur.setHours(openH, openM, 0, 0);
  const close = new Date(dStr + 'T00:00:00');
  close.setHours(closeH, closeM, 0, 0);
  const now = new Date();
  while (cur.getTime() + dur * 60000 <= close.getTime()) {
    if (cur > now) slots.push({ start: cur.toISOString() });
    cur = new Date(cur.getTime() + 30 * 60000);
  }
  return slots;
}

async function loadMonthAvailability() {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = isoDate(new Date());
  const toFetch = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const dStr = isoDate(d);
    if (dStr < todayStr) continue;
    if (isDayClosed(d)) { dayAvailability[dStr] = []; continue; }
    if (dayAvailability[dStr] !== undefined) continue;
    toFetch.push(dStr);
  }
  if (!toFetch.length) { renderCalendarGrid(); return; }
  if (isDemoMode) {
    toFetch.forEach(dStr => { dayAvailability[dStr] = generateDemoSlots(dStr); });
    renderCalendarGrid();
    return;
  }
  await Promise.all(toFetch.map(async dStr => {
    try {
      const r = await fetch(`${API}/api/booking/${encodeURIComponent(biz.slug)}/slots?date=${dStr}&service_id=${selectedService.id}${selectedResource ? '&resource_id=' + selectedResource.id : ''}`);
      const dd = await r.json();
      dayAvailability[dStr] = dd.slots || [];
    } catch (e) {
      dayAvailability[dStr] = [];
    }
  }));
  renderCalendarGrid();
}

window.selectDay = function(dStr, cellEl) {
  const slots = dayAvailability[dStr] || [];
  if (!slots.length) return;
  bubbleOpenDate = dStr;
  const [y, m, dd] = dStr.split('-').map(Number);
  const dateObj = new Date(y, m - 1, dd);
  const panel = document.getElementById('rdvSlotsPanel');
  panel.innerHTML = `
    <div class="rdv-slots-panel-title">${fmtDate(dateObj)}</div>
    <div class="rdv-slots-panel-grid">
      ${slots.map((s, i) => `<div class="rdv-slot" onclick="selectSlot(${i})" id="panel-slot-${i}">${fmtTime(s.start)}</div>`).join('')}
    </div>
  `;
  window._bubbleSlots = slots;
  document.querySelectorAll('.rdv-cal-day').forEach(c => c.classList.remove('selected'));
  cellEl.classList.add('selected');
  setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
};

function closeBubble() {
  const panel = document.getElementById('rdvSlotsPanel');
  if (panel) panel.innerHTML = '';
}

window.selectSlot = function(i) {
  const slots = window._bubbleSlots || [];
  selectedSlot = slots[i];
  const [y, m, dd] = bubbleOpenDate.split('-').map(Number);
  selectedDate = new Date(y, m - 1, dd);
  document.querySelectorAll('#rdvSlotsPanel .rdv-slot').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(`panel-slot-${i}`);
  if (el) el.classList.add('selected');
  document.getElementById('rdvNextBtn').disabled = false;
};

function renderStep2() {
  const isToday = isoDate(selectedDate) === isoDate(new Date());
  wrap.innerHTML = `
    ${header(2)}
    <div class="rdv-card">
      <div class="rdv-label">${t('step2')} — ${escapeHtml(selectedService.name)}${selectedResource ? ' · ' + escapeHtml(selectedResource.name) : ''}</div>
      <div id="rdvCalendar"></div>
    </div>
    <button class="rdv-btn rdv-btn-primary" id="rdvNextBtn" disabled onclick="renderStep3()">${t('next')}</button>
    <button class="rdv-btn rdv-btn-back" onclick="${(biz.staff_selection_enabled && (biz.staff||[]).length>0) ? 'renderStaffStep()' : 'renderStep1()'}">← ${t('back')}</button>
    ${langSwitcher()}`;
  initCalendar();
}

function renderStep3() {
  wrap.innerHTML = `
    ${header(3)}
    <div class="rdv-card">
      <div class="rdv-summary">
        <b>${escapeHtml(selectedService.name)}</b>${selectedResource ? ' · ' + escapeHtml(selectedResource.name) : ''}<br>
        ${t('summaryOn')} ${fmtDate(selectedDate)} ${t('summaryAt')} ${fmtTime(selectedSlot.start)}
      </div>
      <div class="rdv-field">
        <label>${t('name')}</label>
        <input type="text" id="rdvName" placeholder="${t('name')}">
      </div>
      <div class="rdv-field">
        <label>${t('phone')}</label>
        <input type="tel" id="rdvPhone" placeholder="${t('phone')}">
      </div>
      <div class="rdv-field">
        <label>${t('email')}</label>
        <input type="email" id="rdvEmail" placeholder="${t('email')}">
      </div>
    </div>
    <button class="rdv-btn rdv-btn-primary" id="rdvConfirmBtn" onclick="submitBooking()">${t('confirm')}</button>
    <button class="rdv-btn rdv-btn-back" onclick="renderStep2()">← ${t('back')}</button>
    ${langSwitcher()}`;
}

window.submitBooking = async function() {
  if (submitting) return;
  const name = document.getElementById('rdvName').value.trim();
  const phone = document.getElementById('rdvPhone').value.trim();
  const email = document.getElementById('rdvEmail').value.trim();
  if (!name || !phone) {
    alert(t('requiredFields'));
    return;
  }
  submitting = true;
  const btn = document.getElementById('rdvConfirmBtn');
  btn.disabled = true;
  btn.textContent = t('confirming');
  if (isDemoMode) {
    setTimeout(() => { submitting = false; renderSuccess(true, true); }, 600);
    return;
  }
  try {
    const r = await fetch(`${API}/api/booking/${encodeURIComponent(biz.slug)}/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: selectedService.id,
        date: isoDate(selectedDate),
        time: fmtTime(selectedSlot.start).length === 5 ? new Date(selectedSlot.start).toTimeString().slice(0, 5) : '',
        client_name: name,
        client_phone: phone,
        client_email: email || undefined,
        resource_id: selectedResource ? selectedResource.id : undefined,
        lang: lang
      })
    });
    const d = await r.json();
    submitting = false;
    if (r.status === 409 || d.status === 'conflict') {
      alert(t('conflictMsg'));
      renderStep2();
      return;
    }
    if (r.status === 403 && d.error === 'service_unavailable') { const SU_MSGS = {fr:'Ce service est temporairement indisponible. Merci de nous contacter directement.',en:'This service is temporarily unavailable. Please contact us directly.',de:'Dieser Service ist vorübergehend nicht verfügbar. Bitte kontaktieren Sie uns direkt.',es:'Este servicio no está disponible temporalmente. Por favor, contáctenos directamente.',it:'Questo servizio è temporaneamente non disponibile. Vi preghiamo di contattarci direttamente.',pt:'Este serviço está temporariamente indisponível. Por favor, contacte-nos diretamente.',nl:'Deze dienst is tijdelijk niet beschikbaar. Neem rechtstreeks contact met ons op.',pl:'Ta usługa jest tymczasowo niedostępna. Prosimy o bezpośredni kontakt.'}; alert(SU_MSGS[lang] || SU_MSGS.fr); btn.disabled = false; btn.textContent = t('confirm'); return; }
    if (!r.ok) {
      alert(t('errorGeneric'));
      btn.disabled = false;
      btn.textContent = t('confirm');
      return;
    }
    renderSuccess(d.status === 'confirmed');
  } catch (e) {
    submitting = false;
    alert(t('errorGeneric'));
    btn.disabled = false;
    btn.textContent = t('confirm');
  }
};

function renderSuccess(isConfirmed, isDemo) {
  wrap.innerHTML = `
    <div class="rdv-card rdv-success">
      <div class="rdv-success-icon">${isConfirmed ? '✅' : '⏳'}</div>
      <div class="rdv-success-title">${isConfirmed ? t('confirmedTitle') : t('pendingTitle')}</div>
      <div class="rdv-success-msg">${isDemo ? t('demoMsg') : (isConfirmed ? t('confirmedMsg') : t('pendingMsg'))}</div>
    </div>
    ${langSwitcher()}`;
}

boot();
</script>
</body>
</html>
